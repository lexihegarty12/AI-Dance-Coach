[theme]
base = "light"
primaryColor = "#1C1B1A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
textColor = "#55534F"
linkColor = "#3F3D3A"
borderColor = "#E4E2DE"
greenColor = "#6F8A6A"
orangeColor = "#B98A4A"
redColor = "#9B5A55"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Krona One:https://fonts.googleapis.com/css2?family=Krona+One&display=swap"
baseRadius = "24px"
buttonRadius = "999px"
showWidgetBorder = true
headingFontSizes = ["48px", "32px", "24px", "18px", "15px", "13px"]
headingFontWeights = [400, 400, 400, 400, 400, 400]

[client]
showErrorDetails = "type"
